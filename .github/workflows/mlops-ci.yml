name: MLOps CI Pipeline

on:
  push:
    branches: [ "main", "feature/pipeline-ml" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar Dependências do Ecossistema
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Gerar Camada Gold (Ingestão)
      run: |
        python src/ingestao_camada_gold.py

    - name: Separar Dados de Treino e Teste
      run: |
        python src/split_data.py

    - name: Treinar Modelo (Gera o Artefato .pkl)
      run: |
        python src/train_model.py

    - name: Executar Suíte de Testes com Pytest (Garantia de QA)
      run: |
        pytest -v
